    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: #262626;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        @keyframes transitionIn1 {
            from {
                opacity: 0;
                display: none;
                transform: translateY(+50px);

            }

            to {
                opacity: 1;
                display: block;
                transform: translateY(0);
            }
        }

        @keyframes transitionIn2 {
            from {
                opacity: 0;
                display: none;
                transform: translateY(+50px);

            }

            to {
                opacity: 1;
                display: block;
                transform: translateY(0);
            }
        }

        @keyframes transitionIn3 {
            from {
                opacity: 0;
                display: none;
                transform: translateY(+50px);

            }

            to {
                opacity: 1;
                display: block;
                transform: translateY(0);
            }
        }

        @keyframes transitionIn4 {
            from {
                opacity: 0;
                display: none;
                transform: translateY(+50px);

            }

            to {
                opacity: 1;
                display: block;
                transform: translateY(0);
            }
        }

        .error-body {
            height: 100dvh;
            width: 100vw;
            display: flex;
            align-content: center;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .error-content {
            color: #ffffff;
            height: 60vh;
            width: 38vw;
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: space-around;
            align-items: center;
            text-align: justify;
        }

        .error-container {
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #error-404 {
            font-family: 'Ranade', sans-serif;
            font-size: 5rem;
            animation: transitionIn1 1.1s;
            animation-delay: 50ms;
            text-align: center;
        }

        #error-404-text {
            font-family: 'Ranade', sans-serif;
            font-size: 2rem;
            animation: transitionIn2 1.1s;
            animation-delay: 150ms;
        }

        #error-text {
            font-family: 'Ranade', sans-serif;
            font-size: 1.4rem;
            animation: transitionIn3 1.2s;
            animation-delay: 200ms;
        }

        #error-btn {
            animation: transitionIn4 1.1s;
            animation-delay: 300ms;
        }

        .error-btn {
            padding: 1rem;
        }

        .error-btn a {
            font-family: 'Ranade', sans-serif;
            color: #ffffff;
            font-size: 1.4rem;
            text-decoration: none;
        }

        .error-btn {
            position: relative;
            color: var(--text-2);
            text-transform: uppercase;
            transition: all 500ms cubic-bezier(0.77, 0, 0.175, 1);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }

        .error-btn:before,
        .error-btn:after {
            content: '';
            position: absolute;
            transition: inherit;
            z-index: -1;
        }

        .error-btn:hover {
            color: #ffffff;
            transition-delay: .5s;
        }

        .error-btn:hover:before {
            transition-delay: 0s;
            z-index: -1;
        }

        .error-btn:hover:after {
            background: rgba(255, 255, 255, 0.2);
            transition-delay: .35s;
        }

        .from-left:before,
        .from-left:after {
            top: 0;
            width: 0;
            height: 100%;
        }

        .from-left:before {
            right: 0;
            border: 1px solid #ffffff;
            border-left: 0;
            border-right: 0;
        }

        .from-left:after {
            left: 0;
        }

        .from-left:hover:before,
        .from-left:hover:after {
            width: 100%;
        }

        @media (max-width: 8.5in) {
            :root {
                font-size: 18px;
            }
        }

        @media (max-width: 5.5in) {
            :root {
                font-size: 12px;
            }
        }

        @media(max-width: 1280px) {
            .error-content {
                height: 55vh;
                width: 90vw;
                padding: 2rem;
                padding-top: 0rem;
            }
        }
    </style>
